<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuning Up for Launch - Coming Soon | Apex Auto Care</title>
  <meta name="description" content="Our team is building new features and tuning up our platform for launch. Stay tuned!">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              charcoal: '#121824',
              red: '#DC2626'
            }
          },
          fontFamily: {
            serif: ['Oswald', 'sans-serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Early Theme & RTL Restore -->
  <script>
    (function() {
      const theme = localStorage.getItem('apexTheme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      const rtl = localStorage.getItem('apexRTL');
      if (rtl === 'rtl' || rtl === 'true') {
        document.documentElement.dir = 'rtl';
      } else {
        document.documentElement.dir = 'ltr';
      }
    })();
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23DC2626%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z%22/></svg>">
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300 font-sans relative overflow-hidden">

  <!-- Background Ambient Pattern -->
  <div class="absolute inset-0 bg-[radial-gradient(#DC2626_1px,transparent_1px)] [background-size:24px_24px] opacity-10 dark:opacity-20 pointer-events-none"></div>

  <!-- Centered Card Modal Container -->
  <div class="max-w-md w-full sm:max-w-lg bg-white dark:bg-slate-900/95 backdrop-blur-xl border border-slate-200 dark:border-slate-800/80 rounded-3xl shadow-2xl p-6 sm:p-8 relative z-10 text-center transition-colors duration-300">
    
    <!-- Card Header -->
    <div class="flex items-center justify-between pb-5 border-b border-slate-200 dark:border-slate-800/80 mb-6">
      
      <!-- Brand Logo & Name -->
      <a href="index.html" class="flex items-center gap-2.5 group">
        <div class="w-9 h-9 bg-brand-red text-white flex items-center justify-center rounded-xl font-bold shadow-lg shadow-brand-red/30 group-hover:scale-105 transition-transform">
          <i data-lucide="wrench" class="w-4.5 h-4.5"></i>
        </div>
        <div class="flex flex-col text-left">
          <span class="font-serif text-lg font-bold uppercase tracking-wider text-slate-900 dark:text-white leading-tight">AutoCare</span>
        </div>
      </a>

      <!-- Header Control Buttons (Theme & RTL Toggle) -->
      <div class="flex items-center gap-2">
        <button type="button" class="theme-toggle-btn w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800/80 text-amber-500 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" title="Toggle Theme">
          <i data-lucide="sun" class="w-4 h-4 theme-sun"></i>
          <i data-lucide="moon" class="w-4 h-4 theme-moon hidden"></i>
        </button>
        <button type="button" class="rtl-toggle-btn w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800/80 text-blue-500 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" title="Toggle Direction">
          <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
        </button>
      </div>

    </div>

    <!-- Center Icon Box -->
    <div class="w-20 h-20 mx-auto mb-6 bg-brand-red/10 border border-brand-red/20 rounded-2xl flex items-center justify-center text-brand-red shadow-lg shadow-brand-red/10 animate-pulse">
      <i data-lucide="rocket" class="w-10 h-10"></i>
    </div>

    <!-- Category Badge -->
    <span class="block text-xs font-mono font-bold uppercase tracking-[0.25em] text-brand-red mb-2">NEW FEATURE</span>

    <!-- Title -->
    <h1 class="font-serif text-2xl sm:text-4xl font-extrabold text-slate-900 dark:text-white mb-3 tracking-tight">
      Something Exciting is Coming Soon!
    </h1>

    <!-- Description -->
    <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 max-w-sm mx-auto mb-8 leading-relaxed">
      Our team is building this new feature for your premier auto care center. Stay tuned for exciting updates!
    </p>

    <!-- Countdown Grid -->
    <div class="grid grid-cols-4 gap-2 sm:gap-4 max-w-sm mx-auto mb-8">
      <div class="p-3 bg-slate-100 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl text-center shadow-sm">
        <span id="days" class="font-serif text-xl sm:text-3xl font-extrabold text-brand-red block">14</span>
        <span class="text-[10px] font-mono font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">DAYS</span>
      </div>
      <div class="p-3 bg-slate-100 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl text-center shadow-sm">
        <span id="hours" class="font-serif text-xl sm:text-3xl font-extrabold text-brand-red block">08</span>
        <span class="text-[10px] font-mono font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">HOURS</span>
      </div>
      <div class="p-3 bg-slate-100 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl text-center shadow-sm">
        <span id="minutes" class="font-serif text-xl sm:text-3xl font-extrabold text-brand-red block">45</span>
        <span class="text-[10px] font-mono font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">MINS</span>
      </div>
      <div class="p-3 bg-slate-100 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl text-center shadow-sm">
        <span id="seconds" class="font-serif text-xl sm:text-3xl font-extrabold text-brand-red block">12</span>
        <span class="text-[10px] font-mono font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">SECS</span>
      </div>
    </div>

    <!-- Action Button -->
    <div class="mb-6">
      <a href="index.html" class="w-full py-3.5 bg-brand-red hover:bg-red-700 text-white text-xs font-bold rounded-xl shadow-lg shadow-brand-red/30 transition-all flex items-center justify-center gap-2 group">
        <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i> Back to Home
      </a>
    </div>

    <!-- Card Footer -->
    <div class="border-t border-slate-200 dark:border-slate-800/80 pt-4 mt-2">
      <p class="text-[11px] text-slate-500 dark:text-slate-400 text-center">
        Developed by <span class="font-bold text-slate-900 dark:text-white">Abhivorn Technologies Pvt. Ltd.</span>
      </p>
    </div>

  </div>

  <!-- Scripts -->
  <script src="../assets/js/main.js"></script>
  <script>
    // Live Countdown Timer Script
    (function() {
      let d = 14, h = 8, m = 45, s = 12;
      const daysEl = document.getElementById('days');
      const hoursEl = document.getElementById('hours');
      const minsEl = document.getElementById('minutes');
      const secsEl = document.getElementById('seconds');

      setInterval(() => {
        if (s > 0) {
          s--;
        } else {
          s = 59;
          if (m > 0) {
            m--;
          } else {
            m = 59;
            if (h > 0) {
              h--;
            } else {
              h = 23;
              if (d > 0) d--;
            }
          }
        }
        if (daysEl) daysEl.textContent = String(d).padStart(2, '0');
        if (hoursEl) hoursEl.textContent = String(h).padStart(2, '0');
        if (minsEl) minsEl.textContent = String(m).padStart(2, '0');
        if (secsEl) secsEl.textContent = String(s).padStart(2, '0');
      }, 1000);
    })();
  </script>
</body>
</html>
