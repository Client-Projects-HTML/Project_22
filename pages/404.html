<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Apex Auto Care</title>
  <meta name="description" content="The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              charcoal: '#121824',
              red: '#DC2626'
            }
          },
          fontFamily: {
            serif: ['Oswald', 'sans-serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Early Theme & RTL Restore -->
  <script>
    (function() {
      const theme = localStorage.getItem('apexTheme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      const rtl = localStorage.getItem('apexRTL');
      if (rtl === 'rtl' || rtl === 'true') {
        document.documentElement.dir = 'rtl';
      } else {
        document.documentElement.dir = 'ltr';
      }
    })();
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23DC2626%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z%22/></svg>">
</head>
<body class="min-h-screen flex flex-col justify-between bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 transition-colors duration-300 font-sans">

  

  <!-- MAIN 404 CONTENT -->
  <main class="flex-1 flex items-center justify-center py-16 px-4 relative overflow-hidden">
    <!-- Subtle Background Grid Pattern -->
    <div class="absolute inset-0 opacity-10 dark:opacity-20 bg-[radial-gradient(#DC2626_1px,transparent_1px)] [background-size:20px_20px] pointer-events-none"></div>

    <div class="relative z-10 max-w-2xl mx-auto text-center">
      
      <!-- Animated / Glowing Icon Badge -->
      <div class="inline-flex items-center justify-center w-20 h-20 bg-brand-red/10 text-brand-red border border-brand-red/30 rounded-full mb-6 shadow-inner">
        <i data-lucide="alert-triangle" class="w-10 h-10"></i>
      </div>

      <!-- Large 404 Display -->
      <h1 class="font-serif text-7xl sm:text-9xl font-extrabold tracking-widest text-brand-charcoal dark:text-white mb-2 leading-none">
        4<span class="text-brand-red">0</span>4
      </h1>

      <span class="inline-block font-mono text-xs uppercase tracking-[0.25em] text-brand-red font-bold mb-4">
        Wrong Turn / Detour Ahead
      </span>

      <h2 class="font-serif text-2xl sm:text-3xl font-bold uppercase text-brand-charcoal dark:text-white mb-4">
        Looks Like You Hit a Dead End
      </h2>

      <p class="text-neutral-600 dark:text-neutral-400 text-xs sm:text-sm max-w-md mx-auto mb-8 leading-relaxed">
        The page or service address you are looking for has been moved, renamed, or doesn't exist in our garage menu.
      </p>

      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
        <a href="index.html" class="w-full sm:w-auto px-8 py-3.5 bg-brand-red hover:bg-red-700 text-white text-xs font-bold uppercase tracking-widest rounded shadow-lg transition-all flex items-center justify-center gap-2">
          <i data-lucide="home" class="w-4 h-4"></i> Back To Homepage
        </a>
        <a href="services.html" class="w-full sm:w-auto px-8 py-3.5 border border-neutral-300 dark:border-neutral-700 hover:border-brand-red dark:hover:border-brand-red text-neutral-800 dark:text-neutral-200 text-xs font-bold uppercase tracking-widest rounded transition-all flex items-center justify-center gap-2">
          <i data-lucide="wrench" class="w-4 h-4"></i> Browse Services
        </a>
      </div>

      <!-- Useful Quick Nav Links -->
      <div class="mt-12 pt-8 border-t border-neutral-200 dark:border-neutral-800">
        <p class="text-xs text-neutral-500 dark:text-neutral-400 font-medium mb-3">Popular Destination Links:</p>
        <div class="flex flex-wrap justify-center gap-4 text-xs font-semibold">
          <a href="booking.html" class="text-brand-red hover:underline">Book Appointment</a>
          <span class="text-neutral-300 dark:text-neutral-700">•</span>
          <a href="pricing.html" class="text-neutral-700 dark:text-neutral-300 hover:text-brand-red">Pricing</a>
          <span class="text-neutral-300 dark:text-neutral-700">•</span>
          <a href="contact.html" class="text-neutral-700 dark:text-neutral-300 hover:text-brand-red">Contact Support</a>
        </div>
      </div>

    </div>
  </main>

  

  <!-- JS SCRIPTS -->
  <script src="../assets/js/main.js"></script>
</body>
</html>
