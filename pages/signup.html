<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Apex Auto Care & Oil Change</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              charcoal: '#0b0d12',
              cardDark: '#121620',
              red: '#e52323',
              redHover: '#cc1e1e'
            }
          },
          fontFamily: {
            serif: ['Oswald', 'sans-serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">

  <!-- Early Theme & RTL Restore -->
  <script>
      (function () {
        const theme = localStorage.getItem('apexTheme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        const dir = localStorage.getItem('apexDir');
        if (dir) {
          document.documentElement.setAttribute('dir', dir);
        }
      })();
  </script>

  <!-- Favicon -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23DC2626%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z%22/></svg>">
</head>

<body
  class="min-h-screen flex flex-col bg-slate-50 dark:bg-brand-charcoal text-neutral-800 dark:text-neutral-100 transition-colors duration-300 font-sans selection:bg-brand-red selection:text-white">

  <!-- MAIN CONTENT -->
  <main class="flex-1 pt-20 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Back to Home -->
    <a href="index.html"
      class="absolute top-6 left-6 sm:top-8 sm:left-8 flex items-center gap-2 text-neutral-500 hover:text-brand-charcoal dark:hover:text-white transition-colors font-semibold text-xs uppercase tracking-wider z-50">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
    </a>

    <!-- Background Grid Effect -->
    <div
      class="absolute inset-0 bg-[radial-gradient(#e52323_1px,transparent_1px)] [background-size:32px_32px] opacity-10 pointer-events-none">
    </div>

    <div class="w-full max-w-md relative z-10">

      <!-- CARD CONTAINER -->
      <div
        class="bg-white dark:bg-brand-cardDark border border-neutral-200 dark:border-neutral-800 rounded-3xl p-8 sm:p-10 shadow-2xl relative">

        <!-- Toggles -->
        <div class="absolute top-4 right-4 flex items-center gap-2">
          <button type="button"
            class="theme-toggle-btn w-8 h-8 rounded bg-neutral-100 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 text-neutral-600 dark:text-neutral-400 flex items-center justify-center hover:text-brand-charcoal dark:hover:text-white transition-colors">
            <i data-lucide="sun" class="theme-sun w-4 h-4 hidden"></i>
            <i data-lucide="moon" class="theme-moon w-4 h-4"></i>
          </button>
          <button type="button"
            class="rtl-toggle-btn w-8 h-8 rounded bg-neutral-100 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 text-neutral-600 dark:text-neutral-400 flex items-center justify-center hover:text-brand-charcoal dark:hover:text-white transition-colors">
            <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Brand Logo -->
        <div class="flex justify-center mb-6">
          <a href="index.html" class="flex items-center gap-2 group">
            <div
              class="w-8 h-8 bg-brand-red text-white flex items-center justify-center rounded font-bold shadow-lg shadow-brand-red/30">
              <i data-lucide="wrench" class="w-4 h-4"></i>
            </div>
            <div class="flex flex-col">
              <span
                class="font-serif text-xl font-extrabold uppercase tracking-wider text-brand-charcoal dark:text-white leading-none">AutoCare</span>
            </div>
          </a>
        </div>

        <!-- Header -->
        <div class="text-center mb-8">
          <span
            class="inline-block text-[10px] font-mono uppercase tracking-[0.2em] text-brand-red bg-brand-red/10 border border-brand-red/20 px-3 py-1 rounded-full mb-3 font-semibold">
            Join Apex Rewards
          </span>
          <h1 class="font-serif text-3xl font-extrabold uppercase text-brand-charcoal dark:text-white tracking-tight">
            Create Account</h1>
          <p class="text-neutral-600 dark:text-neutral-400 text-xs mt-2">Track vehicle maintenance history & fast-track
            Express Bay appointments.</p>
        </div>

        <!-- SIGN UP FORM -->
        <form action="#" method="POST" class="space-y-4">

          <!-- Full Name -->
          <div>
            <label
              class="block text-xs font-mono uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-2">Full
              Name *</label>
            <div class="relative">
              <i data-lucide="user" class="w-4 h-4 text-neutral-400 dark:text-neutral-500 absolute left-4 top-3.5"></i>
              <input type="text" placeholder="John Doe" required
                class="w-full bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl pl-11 pr-4 py-3 text-xs text-brand-charcoal dark:text-white focus:outline-none focus:border-brand-red transition-colors placeholder:text-neutral-400 dark:placeholder:text-neutral-500">
            </div>
          </div>

          <!-- Email Address -->
          <div>
            <label
              class="block text-xs font-mono uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-2">Email
              Address *</label>
            <div class="relative">
              <i data-lucide="mail" class="w-4 h-4 text-neutral-400 dark:text-neutral-500 absolute left-4 top-3.5"></i>
              <input type="email" placeholder="name@example.com" required
                class="w-full bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl pl-11 pr-4 py-3 text-xs text-brand-charcoal dark:text-white focus:outline-none focus:border-brand-red transition-colors placeholder:text-neutral-400 dark:placeholder:text-neutral-500">
            </div>
          </div>

          <!-- Phone Number -->
          <div>
            <label
              class="block text-xs font-mono uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-2">Phone
              Number *</label>
            <div class="relative">
              <i data-lucide="phone" class="w-4 h-4 text-neutral-400 dark:text-neutral-500 absolute left-4 top-3.5"></i>
              <input type="tel" placeholder="(555) 000-0000" required
                class="w-full bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl pl-11 pr-4 py-3 text-xs text-brand-charcoal dark:text-white focus:outline-none focus:border-brand-red transition-colors placeholder:text-neutral-400 dark:placeholder:text-neutral-500">
            </div>
          </div>

          <!-- Password -->
          <div>
            <label
              class="block text-xs font-mono uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-2">Password
              *</label>
            <div class="relative">
              <i data-lucide="lock" class="w-4 h-4 text-neutral-400 dark:text-neutral-500 absolute left-4 top-3.5"></i>
              <input type="password" placeholder="••••••••" required
                class="w-full bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl pl-11 pr-10 py-3 text-xs text-brand-charcoal dark:text-white focus:outline-none focus:border-brand-red transition-colors placeholder:text-neutral-400 dark:placeholder:text-neutral-500">
              <button type="button"
                class="absolute right-4 top-3.5 text-neutral-400 hover:text-neutral-700 dark:text-neutral-500 dark:hover:text-neutral-300"
                onclick="const input = this.previousElementSibling; input.type = input.type === 'password' ? 'text' : 'password';">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div>
            <label
              class="block text-xs font-mono uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-2">Confirm
              Password *</label>
            <div class="relative">
              <i data-lucide="shield-check"
                class="w-4 h-4 text-neutral-400 dark:text-neutral-500 absolute left-4 top-3.5"></i>
              <input type="password" placeholder="••••••••" required
                class="w-full bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl pl-11 pr-10 py-3 text-xs text-brand-charcoal dark:text-white focus:outline-none focus:border-brand-red transition-colors placeholder:text-neutral-400 dark:placeholder:text-neutral-500">
              <button type="button"
                class="absolute right-4 top-3.5 text-neutral-400 hover:text-neutral-700 dark:text-neutral-500 dark:hover:text-neutral-300"
                onclick="const input = this.previousElementSibling; input.type = input.type === 'password' ? 'text' : 'password';">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Terms Checkbox -->
          <div class="flex items-start gap-2 pt-2">
            <input type="checkbox" id="terms" required
              class="mt-1 accent-brand-red bg-neutral-50 dark:bg-neutral-900 border-neutral-300 dark:border-neutral-800 rounded">
            <label for="terms" class="text-[11px] text-neutral-600 dark:text-neutral-400 leading-tight">
              I agree to the <a href="404.html"
                class="text-brand-charcoal dark:text-white font-semibold underline hover:text-brand-red">Terms of
                Service</a> and <a href="404.html"
                class="text-brand-charcoal dark:text-white font-semibold underline hover:text-brand-red">Privacy
                Policy</a>.
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit"
            class="w-full py-3.5 text-xs uppercase font-bold tracking-wider bg-brand-red hover:bg-brand-redHover text-white rounded-xl shadow-lg shadow-brand-red/25 transition-all flex items-center justify-center gap-2 mt-4">
            <i data-lucide="user-plus" class="w-4 h-4"></i> Create Account
          </button>

        </form>

        <!-- Divider -->
        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-neutral-200 dark:border-neutral-800"></div>
          </div>
          <div class="relative flex justify-center text-[10px] font-mono uppercase"><span
              class="bg-white dark:bg-brand-cardDark px-3 text-neutral-500">Or register with</span></div>
        </div>

        <!-- Social Signup -->
        <div class="grid grid-cols-2 gap-3">
          <button
            class="flex items-center justify-center gap-2 py-2.5 bg-neutral-100 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl text-xs font-semibold text-neutral-700 dark:text-neutral-300 hover:text-brand-charcoal dark:hover:text-white hover:border-neutral-300 dark:hover:border-neutral-700 transition-colors">
            <i data-lucide="chrome" class="w-4 h-4"></i> Google
          </button>
          <button
            class="flex items-center justify-center gap-2 py-2.5 bg-neutral-100 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl text-xs font-semibold text-neutral-700 dark:text-neutral-300 hover:text-brand-charcoal dark:hover:text-white hover:border-neutral-300 dark:hover:border-neutral-700 transition-colors">
            <i data-lucide="apple" class="w-4 h-4"></i> Apple
          </button>
        </div>

        <!-- Existing Account Link -->
        <p class="text-center text-xs text-neutral-600 dark:text-neutral-400 mt-6">
          Already have an account? <a href="login.html" class="text-brand-red font-bold hover:underline">Sign In</a>
        </p>

      </div>

    </div>
  </main>

  <script src="../assets/js/main.js"></script>
</body>

</html>
